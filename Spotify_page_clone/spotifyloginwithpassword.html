<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify - Log in with a password</title>
    <link rel="stylesheet" href="spotifyloginwithpasswordcss.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="spotifyfav.png" />
  </head>
  <body>
    <div class="login-container">
      <div class="step-header">
        <button class="back-arrow" id="back-btn">
          <svg
            data-encore-id="icon"
            fill="#ffffff"
            role="img"
            aria-hidden="true"
            class="e-10830-icon e-10830-icon--auto-mirror"
            viewBox="0 0 16 16"
            width="16"
            height="16"
          >
            <path
              d="M11.03.47a.75.75 0 0 1 0 1.06L4.56 8l6.47 6.47a.75.75 0 1 1-1.06 1.06L2.44 8 9.97.47a.75.75 0 0 1 1.06 0"
            ></path>
          </svg>
        </button>
      </div>
      <h1 class="login-title">Log in with a password</h1>
      <form id="login-form">
        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" maxlength="30" />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" maxlength="30" />
            <button
              type="button"
              class="toggle-password"
              id="toggle-pw-btn"
              aria-label="Toggle password visibility"
            >
              <svg
                id="eye-icon"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="#a7a7a7"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Log in</button>
      </form>
      <button
        type="button"
        class="btn-secondary"
        id="login-without-pw"
        onclick="window.location.href = 'spotfyloginkoda.html'"
      >
        Log in without password
      </button>
      <footer class="recaptcha-footer">
        This site is protected by reCAPTCHA and the Google
        <a href="#">Privacy<br />Policy</a> and
        <a href="#">Terms of Service</a> apply.
      </footer>
    </div>
    <script src="scriptwithpassword.js"></script>
  </body>
</html>
