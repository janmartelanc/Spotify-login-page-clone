<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Tell us about yourself</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-container" style="max-width: 360px;">
        <!-- Logotip -->
        <div class="logo">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.261.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.14 4.2-1.26 9.6-6 13.38 1.5.3.36.18 1.02-.24 1.32zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.3c-.6.18-1.2-.18-1.38-.78-.18-.6.18-1.2.78-1.38 4.26-1.26 11.4-0.96 15.6 1.5.54.3.72 1.02.42 1.56-.3.54-1.02.72-1.56.42z"/></svg>
        </div>

        <!-- Progress bar (2/3) -->
        <div class="progress-container">
            <div class="progress-bar" style="width: 66%;"></div>
        </div>

        <!-- Glava koraka -->
        <div class="step-header">
            <button class="back-arrow">&lt;</button>
            <span>Step 2 of 3</span>
        </div>
        <h1 class="step-title">Tell us about yourself</h1>

        <!-- Ime -->
        <label for="name">Name</label>
        <div class="input-subtitle">This name will appear on your profile</div>
        <input type="text" id="name" />

        <!-- Spol -->
        <label>Gender</label>
        <div class="input-subtitle">We use your gender to help personalize our content recommendations and ads for you.</div>
        <div style="display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;">
            <label style="font-weight: 400;"><input type="radio" name="gender" /> Man</label>
            <label style="font-weight: 400;"><input type="radio" name="gender" /> Woman</label>
            <label style="font-weight: 400;"><input type="radio" name="gender" /> Non-binary</label>
        </div>
        <div style="display: flex; gap: 16px; margin-bottom: 20px;">
            <label style="font-weight: 400;"><input type="radio" name="gender" /> Something else</label>
            <label style="font-weight: 400;"><input type="radio" name="gender" /> Prefer not to say</label>
        </div>

        <!-- Datum rojstva -->
        <label>Date of birth</label>
        <div class="input-subtitle">Why do we need your date of birth? <a href="#" style="color: #ffffff;">Learn more.</a></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" placeholder="dd" style="width: 70px;" maxlength="2" />
            <select style="flex: 2;">
                <option>Month</option>
                <option>January</option>
                <option>February</option>
                <!-- dodaj ostale mesece po želji -->
            </select>
            <input type="text" placeholder="yyyy" style="width: 90px;" maxlength="4" />
        </div>

        <button class="btn-submit">Next</button>

        <div class="recaptcha-footer">
            This site is protected by reCAPTCHA and the Google<br>
            <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a> apply.
        </div>
    </div>

</body>
</html>
